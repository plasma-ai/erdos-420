name = "Erdos420"
defaultTargets = ["OAI", "PrimeNumberTheoremAnd", "RellichKondrachov", "PrimeGapsTheory", "Erdos420", "Challenge", "Solution"]

# No silently-introduced implicit binders anywhere in the corpus.
[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc4"

# Import closure of the Dirichlet seven-eighths theorem from openai/math,
# under its upstream module names.
[[lean_lib]]
name = "OAI"
srcDir = "vendor/OAI"
globs = ["OAI.+"]

# Import closure of `PrimeNumberTheoremAnd.Wiener`, used by the OAI closure.
[[lean_lib]]
name = "PrimeNumberTheoremAnd"
srcDir = "vendor/PrimeNumberTheoremAnd"
globs = ["PrimeNumberTheoremAnd.+"]

# Import closure of the Rellich–Kondrachov theorem, used by the OAI closure.
[[lean_lib]]
name = "RellichKondrachov"
srcDir = "vendor/RellichKondrachov"
globs = ["RellichKondrachov.+"]

# Import closure of Maynard's sieve from AxiomMath/PrimeGapsLib, under its
# upstream module names; see vendor/PrimeGapsLib/README.md.
[[lean_lib]]
name = "PrimeGapsTheory"
srcDir = "vendor/PrimeGapsLib"
globs = ["PrimeGapsTheory.+", "PrimeGapsCert.+"]

[[lean_lib]]
name = "Erdos420"
globs = ["Erdos420.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
